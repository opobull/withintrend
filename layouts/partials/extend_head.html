{{- if eq .Kind "page" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "description": {{ .Description | default (printf "%s — %s" .Title .Site.Title) | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ (default .Date .Lastmod).Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "author": {
    "@type": "Organization",
    "name": "WithinTrend",
    "url": {{ .Site.BaseURL | jsonify }}
  },
  "publisher": {
    "@type": "Organization",
    "name": "WithinTrend",
    "url": {{ .Site.BaseURL | jsonify }}
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify }}
  }{{- with .Params.categories }},
  "articleSection": {{ index . 0 | jsonify }}{{- end }}{{- with .Params.tags }},
  "keywords": {{ delimit . ", " | jsonify }}{{- end }}
}
</script>
{{- end }}

{{- if or (eq .Kind "page") (eq .Kind "section") (eq .Kind "taxonomy") (eq .Kind "term") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ .Site.BaseURL | jsonify }}
    }{{- with .Params.categories }},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ index . 0 | jsonify }},
      "item": {{ printf "%scategories/%s/" $.Site.BaseURL (index . 0 | urlize) | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ $.Title | jsonify }},
      "item": {{ $.Permalink | jsonify }}
    }
    {{- else }},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ .Title | jsonify }},
      "item": {{ .Permalink | jsonify }}
    }
    {{- end }}
  ]
}
</script>
{{- end }}
